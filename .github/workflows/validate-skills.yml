# This workflow deliberately diverges from the CI checklist in
# skills/go-linting/SKILL.md, which is written for a Go service. The reasons,
# and the parts that are a real gap rather than a scope mismatch, are recorded
# in docs/RULE_OWNERSHIP.md under "Scope Exceptions". Do not "fix" it to match
# the checklist without updating that record.
name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_evals:
        description: Run the headless skill evals (needs ANTHROPIC_API_KEY secret)
        type: boolean
        default: false
      eval_set:
        description: Eval set to run
        type: choice
        options: [validation, train, all]
        default: validation
      eval_kind:
        description: Eval kind to run
        type: choice
        options: [all, trigger, quality]
        default: all

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install golangci-lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # TestStructure includes the Agent Skills frontmatter check.
      - name: Run eval tests
        working-directory: evals
        run: go test -count=1 -race -shuffle=on ./...

      - name: Verify golangci-lint config
        run: golangci-lint config verify --config skills/go-linting/assets/golangci.yml

      - name: Validate plugin hooks and agents
        run: |
          python3 -c "import json; json.load(open('hooks/hooks.json'))"
          bash -n hooks/go-vet-on-edit.sh
          bash -n hooks/go-code-routing.sh
          test -f agents/go-verify.md

      # Every relative markdown link resolves, anchor included. A dead path is
      # worse than no path: it sends the model looking for a file that is not
      # there; a dead anchor sends it to the top of the wrong file.
      - name: Check relative links
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          dead = []
          files = glob.glob('skills/**/*.md', recursive=True) + glob.glob('docs/*.md') + glob.glob('agents/*.md') + glob.glob('*.md')
          def strip(text):
              return re.sub(r'`[^`]*`', '', re.sub(r'```.*?```', '', text, flags=re.S))
          def slug(heading):
              heading = re.sub(r'[^\w\- ]', '', heading.strip().lower())
              return heading.replace(' ', '-')
          anchors = {}
          def anchors_of(path):
              if path not in anchors:
                  anchors[path] = {slug(re.sub(r'^#+\s*', '', l)) for l in open(path) if re.match(r'^#{1,6}\s', l)}
              return anchors[path]
          for f in files:
              text = strip(open(f).read())
              for target in re.findall(r'\]\((?!https?:|mailto:)([^)\s]+)\)', text):
                  rel, _, anchor = target.partition('#')
                  path = f if rel == '' else os.path.normpath(os.path.join(os.path.dirname(f), rel))
                  if not os.path.exists(path):
                      dead.append(f'{f} -> {target}')
                  elif anchor and path.endswith('.md') and anchor not in anchors_of(path):
                      dead.append(f'{f} -> {target} (no such heading)')
          print('\n'.join(dead) or 'all relative links and anchors resolve')
          sys.exit(1 if dead else 0)
          PY

  # A v* tag that passed validate becomes a GitHub release whose notes are
  # that version's CHANGELOG section. The only job with write access.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          awk -v h="## [${TAG#v}]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${TAG#v}" >&2
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag

  # Opt-in: runs the trigger and quality evals through the claude CLI. Costs
  # API tokens, so it only runs on manual dispatch with run_evals checked.
  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run evals
        working-directory: evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: go run ./cmd/evalrun -set "${{ inputs.eval_set }}" -kind "${{ inputs.eval_kind }}" -out evals-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-results
          path: evals/evals-results.json
